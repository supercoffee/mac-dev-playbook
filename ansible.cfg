[defaults]
nocows = True
roles_path = ./roles:/etc/ansible/roles
inventory = inventory
become = true
stdout_callback = default

[callback_default]
result_format = yaml

[ssh_connection]
# Pipelining conflicts with sudo's stdin password prompt over SSH and hangs
# become tasks silently (geerlingguy/mac-dev-playbook#93).
pipelining = False
